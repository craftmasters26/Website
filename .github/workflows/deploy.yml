name: Deploy website to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          USER_: ${{ secrets.VPS_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh "$USER_@$HOST" 'flock -w 1500 /tmp/bleachdex-deploy.lock bash -lc "cd /var/www/Bleachdex-Web && git fetch --all && git reset --hard origin/main && bash deploy/deploy-web.sh"'
