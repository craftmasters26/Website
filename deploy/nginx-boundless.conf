# /etc/nginx/sites-available/bleachdex   (complete file, HTTPS already included)
# boundlessproductions.org = company site, boundlessproductions.org/bleachdex = BleachDex.
#   /webhooks/whop , /char-img/  -> bot  (Flask, 127.0.0.1:5000)
#   everything else              -> site (Node,  127.0.0.1:3000)

# Rate-limit zone for the contact form (http context: this file is included inside http {}).
limit_req_zone $binary_remote_addr zone=contact_form:10m rate=6r/m;

# On-disk cache for character/weapon art that lives on GitHub (served to visitors as /gh-img/...).
# One-time setup on the VPS:  sudo mkdir -p /var/cache/nginx/ghimg && sudo chown www-data /var/cache/nginx/ghimg
proxy_cache_path /var/cache/nginx/ghimg levels=1:2 keys_zone=ghimg:20m max_size=1g inactive=30d use_temp_path=off;

# Tells the image cache below whether the browser can take WebP (keeps the two formats apart).
map $http_accept $gh_wants_webp {
    default "";
    "~*image/webp" "webp";
}

# 1) HTTP (port 80): everything goes to https://boundlessproductions.org
server {
    listen 80;
    listen [::]:80;
    server_name boundlessproductions.org www.boundlessproductions.org;
    return 301 https://boundlessproductions.org$request_uri;
}

# 2) HTTPS www -> bare domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.boundlessproductions.org;

    ssl_certificate /etc/letsencrypt/live/boundlessproductions.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boundlessproductions.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://boundlessproductions.org$request_uri;
}

# 3) HTTPS main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boundlessproductions.org;

    ssl_certificate /etc/letsencrypt/live/boundlessproductions.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boundlessproductions.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Security headers (CSP is intentionally not set here: AdSense, Whop embeds and Discord
    # login each need their own allow-list, so add one only after testing those flows).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cache the hashed build assets hard; they change name when their contents change.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Art from the GitHub repo. The Node site fetches it once, resizes it and converts it to WebP when
    # the browser supports that (see server/routes/gh-img). nginx keeps the finished files on disk too,
    # with the WebP/original split in the cache key so each browser gets the right format.
    location /gh-img/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_cache ghimg;
        proxy_cache_key "$uri$is_args$args$gh_wants_webp";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Vary Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status always;
    }

    location = /api/contact {
        limit_req zone=contact_form burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /webhooks/whop {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /char-img/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
