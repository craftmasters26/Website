# /etc/nginx/sites-available/bleachdex
# boundless.run.place = company site, boundless.run.place/bleachdex = BleachDex.
# bleachdex.boundless.run.place is kept only so old links/webhooks still work.
# Same two apps behind both (products live under boundless.run.place/Product):
#   /webhooks/whop , /char-img/  -> bot  (Flask, 127.0.0.1:5000)
#   everything else              -> site (Node,  127.0.0.1:3000)
# Everything else on the bot (/internal/*, /api/*, /login ...) stays private.
server {
    listen 80;
    listen [::]:80;
    server_name boundless.run.place;

    client_max_body_size 10m;

    location = /webhooks/whop {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /char-img/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bleachdex.boundless.run.place;

    client_max_body_size 10m;

    location = /webhooks/whop {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /char-img/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 301 https://boundless.run.place/bleachdex;
    }

    location / {
        return 301 https://boundless.run.place$request_uri;
    }
}
