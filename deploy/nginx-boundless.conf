# /etc/nginx/sites-available/bleachdex
# boundlessproductions.org = company site, boundlessproductions.org/bleachdex = BleachDex.
#   /webhooks/whop , /char-img/  -> bot  (Flask, 127.0.0.1:5000)
#   everything else              -> site (Node,  127.0.0.1:3000)
# Everything else on the bot (/internal/*, /api/*, /login ...) stays private.
# HTTPS is added automatically by: certbot --nginx -d boundlessproductions.org -d www.boundlessproductions.org

server {
    listen 80;
    listen [::]:80;
    server_name boundlessproductions.org;

    client_max_body_size 10m;

    location = /webhooks/whop {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /char-img/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# www -> bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.boundlessproductions.org;
    return 301 https://boundlessproductions.org$request_uri;
}
