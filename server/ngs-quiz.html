ity","Uniform velocity","Acceleration","Distance covered"],3],[2,"Gradient of the speed-time graph is equal to:",["Speed","Velocity","Acceleration","Distance covered"],2],[2,"Gradient of the distance-time graph is equal to the:",["Speed","Velocity","Distance covered","Acceleration"],0],[2,"Which of the following statements about scalars is correct according to the chapter?",["Scalars need both magnitude and direction","Scalar quantities can be added up like numbers","All physical quantities are scalars","Scalars cannot have units"],1],[2,"Which of the following is a vector quantity according to the chapter?",["Mass","Energy","Force","Temperature"],2],[2,"In the head-to-tail rule, after redrawing the vectors, the resultant is the vector from:",["Head of first to tail of last","Tail of first to head of last","Midpoint of first to midpoint of last","Origin to the last head"],1],[2,"The motion of a train or a car is an example of:",["Rotatory motion","Vibratory motion","Translatory motion","Circular motion only"],2],[2,"The blades of a fan rotate about an axis. This is an example of:",["Translatory motion","Rotatory motion","Linear motion","Random motion"],1],[2,"A swing vibrates about its mean position. This is classified as:",["Translatory motion","Rotatory motion","Vibratory motion","Circular motion"],2],[2,"When measuring displacement, the magnitude is the shortest distance and the direction is:",["Arbitrary","From initial to final position","Always northward","Opposite to the path"],1],[2,"Speed does not tell anything about the:",["Magnitude of motion","Direction of motion","Unit of measurement","Time taken"],1],[2,"The formula S = vt is valid when:",["Acceleration is constant and non-zero","Speed is constant (or for average speed)","Velocity is changing","The body is at rest"],1],[2,"In the definition of average velocity, the numerator is:",["Total distance","Displacement","Change in speed","Acceleration × time"],1],[2,"When a paratrooper’s parachute opens, the fo Displacement is always a straight line from initial to final, while distance is the actual path. Therefore, the ratio displacement/distance is:",["Always 1","≤ 1","≥ 1","Can be greater than 1"],1],[2,"Instantaneous speed is the speed at any instant, while average is overall. Speedometer shows:",["Average","Instantaneous","Both equally","Neither"],1],[2,"Acceleration has units derived as m s⁻² from a = Δv / Δt. Deceleration is:",["Positive acceleration","Negative acceleration","Zero acceleration","Infinite acceleration"],1],[2,"The chapter concludes that there is a universal speed limit for any object in the universe that is approximately 3 × 10⁸ m s⁻¹. Students should just be aware that this phenomenon is true; they do not need to study relativity in any depth. The purpose is that students appreciate that there is a:",["Maximum possible speed for objects with mass","Variable speed of light","Only limit for light","Limit only on Earth"],0],[3,"Dynamics is concerned with the forces that produce change in the:",["Position of bodies only","Motions of bodies","Mass of bodies","Temperature of bodies"],1],[3,"A common concept of a force is a push or a pull that starts, stops or changes the:",["Mass of a body","Magnitude and direction of velocity of a body","Volume of a body","Density of a body"],1],[3,"Force transfers energy to an object. An example given is a man moving a wheelbarrow by first applying force to:",["Push it only","Lift it and then push it","Pull it only","Twist it only"],1],[3,"There are two major types of forces:",["Strong and weak forces","Contact Forces and Non-contact Forces","Positive and negative forces","Internal and external forces"],1],[3,"A contact force is a force that is exerted by one object on the other at the:",["Point of maximum separation","Point of contact","Centre of mass only","Infinity"],1],[3,"Friction is the force that resists motion when the surface of one object comes in contact with the surface of another. It is classified as a:",["Non-contact force","Contact force","Nuclear force","Gravitational force only"],1],[3,"The drag force is the resistant force caused by the motion of a body through a:",["Solid","Fluid","Vacuum","Crystal"],1],[3,"Thrust is an upward force exerted by a liquid on an object immersed in it. A ship can float in the sea due to this force which balances the:",["Mass of the ship","Weight of the ship","Volume of the ship","Density of the ship"],1],[3,"Normal force is the force of reaction exerted by the surface on an object lying on it. This force acts:",["Inward and parallel to the surface","Outward and perpendicular to the surface","Downward only","Upward only along the surface"],1],[3,"Air resistance is the resistance offered by air when an object:",["Moves horizontally only","Falls through it","Is at rest","Is in outer space"],1],[3,"Tension force is the force experienced by a rope when a person or load:",["Pushes it","Pulls it","Twists it","Bends it"],1],[3,"Elastic force is a force that brings certain materials back to their original shape after being deformed. Examples include rubber bands, springs and:",["Stones","Trampoline","Metals only","Liquids"],1],[3,"A non-contact force is defined as the force between two objects which are not in physical contact. These are sometimes called:",["Contact forces","Action-at-a-distance forces","Frictional forces","Tension forces"],1],[3,"Non-contact forces are also called field forces because there is always a:",["Contact point","Field linked with a non-contact force","Mass transfer","Charge transfer only"],1],[3,"Gravitational force is an attractive force that exists among all bodies which have:",["Charge","Mass","Volume","Temperature"],1],[3,"Newton's law of gravitation is given by F = G (m1 m2)/r² where G is:",["6.67 × 10⁻¹¹ N m² kg⁻²","6.67 × 10⁻¹¹ N m² kg⁻¹","9.8 N kg⁻¹","10 m s⁻²"],0],[3,"The Sun's gravitational force keeps the Earth and all other planets of our solar system in:",["Straight lines","Fixed orbits","Random paths","Free fall only"],1],[3,"Electrostatic force acts between two charged objects. Opposite charges:",["Repel each other","Attract each other","Have no effect","Cancel each other always"],1],[3,"Magnetic force is a force which a magnet exerts on other magnets and magnetic materials like iron, nickel and:",["Copper","Cobalt","Aluminium","Wood"],1],[3,"Like poles of magnets:",["Attract each other","Repel each other","Have no force","Merge"],1],[3,"Strong and weak nuclear forces are non-contact forces acting between the:",["Planets","Subatomic particles","Macroscopic objects only","Liquids"],1],[3,"There are four fundamental forces in nature. These are gravitational force, electromagnetic force, strong nuclear force and:",["Frictional force","Weak nuclear force","Tension force","Elastic force"],1],[3,"Gravitational force is the weakest one among all four forces. Being a long range force, it extends to:",["10⁻¹⁴ m only","Infinite distance although it becomes weaker and weaker","10⁻¹⁷ m only","The surface of Earth only"],1],[3,"Electromagnetic force causes the interaction between electrically charged particles. It is stronger than gravitational and:",["Strong nuclear force","Weak nuclear forces","All other forces equally","Contact forces only"],1],[3,"Electromagnetic force causes all chemical reactions. It binds together atoms, molecules and:",["Planets","Crystals etc.","Galaxies","Stars only"],1],[3,"Strong nuclear force holds the atomic nuclei together by binding the protons and neutrons in the nucleus overcoming repulsive electromagnetic force between positively charged protons. It is a short-range force with the order of:",["10⁻¹⁴ m","10⁻¹⁷ m","Infinite","1 m"],0],[3,"If the distance between nucleons increases beyond the range of strong nuclear force, this force:",["Increases","Ceases to act","Becomes gravitational","Becomes electromagnetic"],1],[3,"Weak nuclear force is responsible for the disintegration of a nucleus. For example, it executes the β-decay of a neutron, in which a neutron transforms into a:",["Electron","Proton","Photon","Neutrino only"],1],[3,"In β-decay, a β-particle (electron) and an uncharged particle called:",["Neutrino","Antineutrino","Proton","Neutron are emitted."],1],[3,"Weak nuclear force is stronger than the gravitational force but weaker than the:",["Strong nuclear force only","Electromagnetic force","Contact forces","All forces"],1],[3,"Weak nuclear force is a short-range force of the order:",["10⁻¹⁴ m","10⁻¹⁷ m","Infinite","1 km"],1],[3,"A Pakistani scientist Dr. Abdus Salam along with Sheldon Glashow and Steven Weinberg were awarded in 1979 Nobel Prize in Physics for their contributions to the unification of the weak nuclear force and electromagnetic force as:",["Strong force","Electroweak force","Gravitational force","Nuclear force"],1],[3,"Free-body diagrams are used to show the relative magnitudes and directions of all the forces acting on an object in a given situation. Usually, the object is represented by a:",["Circle","Box","Triangle","Line"],1],[3,"In a free-body diagram, the force arrows are drawn outward from the centre of the box in the directions of forces. The length of a force arrow reflects the:",["Direction only","Magnitude of the force","Type of force only","Time of application"],1],[3,"Newton's first law of motion states that a body continues its state of rest or of uniform motion in a straight line unless acted upon by some:",["Internal force","External force","Nuclear force","Weak force"],1],[3,"When a fast-moving bus stops suddenly, the passengers tend to bend forward. It is because they want to continue their:",["Rest","Motion","Acceleration","Deceleration"],1],[3,"When the bus starts moving quickly from rest, the passengers are pushed back against the seat. This time, the tendency of passengers is to retain their state of:",["Motion","Rest","Acceleration","Uniform velocity"],1],[3,"Force is an agency which changes or tends to change the state of rest or of uniform motion of a body. In simple words, force causes:",["Mass change","Acceleration","Volume change","Temperature change"],1],[3,"The property of a body to maintain its state of rest or of uniform motion in a straight line is called:",["Momentum","Inertia","Impulse","Weight"],1],[3,"The mass of an object is a measure of its:",["Weight","Inertia","Volume","Density only"],1],[3,"The greater the mass of an object, the greater is its:",["Acceleration for same force","Inertia","Speed always","Temperature"],1],[3,"Newton's first law is sometimes called as law of:",["Momentum","Inertia","Action-reaction","Gravitation"],1],[3,"Newton's second law of motion states that if a net external force acts upon a body, it accelerates the body in the direction of force. The magnitude of acceleration is directly proportional to the magnitude of force and is inversely proportional to the:",["Velocity","Mass of the body","Time","Displacement"],1],[3,"Mathematically, Newton's second law is written as:",["F = m/a","F = ma","F = a/m","F = m + a"],1],[3,"One newton is the force which produces an acceleration of 1 m s⁻² in a body of mass:",["1 g","1 kg","10 kg","100 kg"],1],[3,"From F = ma, 1 N =:",["1 kg m s⁻¹","1 kg m s⁻²","1 g m s⁻²","1 kg s⁻²"],1],[3,"Newton's second law also tells that a force can change the velocity of a body by producing acceleration or deceleration in it. As velocity is a vector quantity, so the change may be in its magnitude, direction or in:",["Mass","Both of them","Time only","Position only"],1],[3,"Newton's third law of motion states that for every action, there is always an equal and:",["Same direction reaction","Opposite reaction","Larger reaction","Smaller reaction"],1],[3,"Action and reaction do not act on the same body but they act on two different bodies, so they can never:",["Be equal","Balance each other","Be opposite","Exist"],1],[3,"If one body exerts a force on a second body, the second body also exerts an equal and opposite force on the:",["Same body","First body","Ground","Air"],1],[3,"When a bullet is fired from a gun, the bullet moves in the forward direction with a force F (action). The gun recoils in the backward direction with a reaction force R. This is an example of:",["Newton's first law","Newton's third law","Conservation of energy only","Friction"],1],[3,"Newton's laws of motion can be applied with very high degree of accuracy to the motion of objects and velocities which we come across in everyday life. Problems arise when we deal with the motion of elementary particles having velocities close to that of:",["Sound","Light","A car","Wind"],1],[3,"For velocities close to the speed of light, relativistic mechanics developed by:",["Newton","Albert Einstein","Abdus Salam","Galileo is applicable."],1],[3,"Newton's laws of motion are not exact for all types of motion, but provide a good approximation, unless an object is small enough or moving close to the:",["Speed of sound","Speed of light","Escape velocity","Terminal velocity"],1],[3,"Commonly, we consider mass and weight as the same quantities but scientifically, mass and weight are:",["The same","Two different quantities","Always equal","Both vectors"],1],[3,"The simplest definition of mass is that it is a measure of the quantity of matter in a body. Scientifically, mass of a body can be defined as the characteristic of a body which determines the magnitude of acceleration produced when a certain force acts upon it. Mass is a:",["Vector quantity","Scalar quantity","Sometimes scalar sometimes vector","Force"],1],[3,"Mass remains the same everywhere. Practically, mass is measured by an ordinary balance. The SI unit of mass is:",["Newton","Kilogram (kg)","Pascal","Joule"],1],[3,"Weight is a gravitational force acting on the object. It is a vector quantity directed downward, towards the:",["Horizon","Centre of the Earth","North","Sky"],1],[3,"The weight of an object is equal to the force with which the Earth attracts the body towards its centre. Weight = mg where g is the gravitational field strength. Its value is:",["10 N kg⁻¹","9.8 m s⁻¹","10 m s⁻¹","1 N kg⁻¹"],0],[3,"As the value of g varies from place to place and also with altitude, therefore, the value of weight does not remain the same everywhere. It varies from place to place according to variation in:",["Mass","g","Volume","Density"],1],[3,"Though an object's weight may vary from one place to another, but at any particular location, its weight is proportional to its:",["Volume","Mass","Temperature","Charge"],1],[3,"The weight cannot be measured by an ordinary balance. A spring balance can be used to measure the weight. The SI unit of weight is:",["kg","Newton (N)","m s⁻²","Joule"],1],[3,"In Example 3.1, a 10 kg block moves on a frictionless horizontal surface with an acceleration of 2 m s⁻². The force acting on the block is:",["5 N","20 N","12 N","2 N"],1],[3,"In Example 3.2, a force of 7500 N is applied to a truck of mass 3000 kg. The acceleration produced is:",["2.5 m s⁻²","5 m s⁻²","0.4 m s⁻²","25 m s⁻²"],0],[3,"In Example 3.2, the time to accelerate the truck from 36 km h⁻¹ to 72 km h⁻¹ is:",["2 s","4 s","8 s","10 s"],1],[3,"Mechanical balances consist of a rigid horizontal beam that oscillates on a central knife edge as a:",["Fulcrum","Pivot only for rotation","Spring","Magnet"],0],[3,"In mechanical platform balances used for heavy items, standard weights are not required because the fulcrum of the beam is kept very near to its one end. Therefore, much smaller weights have to be put at the other end. These smaller weights have already been:",["Removed","Calibrated to the standard weights","Increased","Made equal to the load"],1],[3,"Electronic balances require no standard weights. They have to be connected to a power supply or can operate by using dry cell batteries. An electronic balance is more precise than:",["Spring balance only","Mechanical balance","Force meter","All instruments equally"],1],[3,"A force meter is a scientific instrument that measures force. It is also called as a newton meter or a:",["Ordinary balance","Spring balance","Platform balance","Electronic mass balance"],1],[3,"An ordinary force meter has a spring inside it. The object to be weighed is hung with the hook. The mass of the object causes the spring to:",["Expand always","Compress (in some designs)","Break","Remain unchanged"],1],[3,"In some spring balances, the scale measures the mass which can be readily converted into newtons by multiplying the mass in kg with the value of g =:",["9.8 m s⁻²","10 m s⁻²","1 m s⁻²","100 m s⁻²"],1],[3,"Do You Know: The weight of 100 g mass is:",["1 N","10 N","0.1 N","100 N"],0],[3,"Friction is a dissipative force due to which the energy is wasted in doing work to overcome against friction. The lost energy appears in the form of:",["Light","Heat","Sound only","Electricity"],1],[3,"A very common example of energy dissipation is the rubbing of hands. When we rub our hands, heat is produced due to friction and our hands become:",["Cold","Warm","Wet","Dry only"],1],[3,"Shooting of stars seen in the sky at night also happen due to friction of air. These are actually asteroids that enter the Earth's atmosphere. As they are moving, air resistance causes generation of heat. Their temperature becomes so high that they start burning and ultimately:",["Increase in size","Disintegrate","Become planets","Stop"],1],[3,"Sliding friction is the friction between two solid surfaces which can be divided into two categories: static friction and:",["Rolling friction","Kinetic friction","Fluid friction","Air resistance"],1],[3,"Static friction is the opposing force that appears when a force tends to pull a block but does not let the block move. The limit of static friction is equal to the total weights including pan when the block:",["Remains at rest forever","Starts sliding","Accelerates upward","Floats"],1],[3,"When the block is sliding, friction still exists. It is known as:",["Static friction","Kinetic friction","Rolling friction","Limiting friction only"],1],[3,"Terminal velocity is the constant velocity achieved by an object when the upward force of air resistance balances the downward force of gravity. When this happens, the object stops:",["Moving","Accelerating","Falling","Experiencing gravity"],1],[3,"Even a heavy object like a meteorite does not gain an infinite velocity as it falls to the Earth because of:",["Increasing mass","Air resistance leading to terminal velocity","Decreasing g","Magnetic force"],1],[3,"Air resistance acting against the large surface area of a parachute allows for descent at a safer velocity. This is the principle applied to:",["Planes only","Paratroopers","Cars","Trains"],1],[3,"Rolling friction is the friction produced when an object rolls over a surface. A body with wheels faces less friction as compared to a body of the same size without wheels. The rolling friction is about:",["Ten times smaller than the sliding friction","One hundred times smaller than the sliding friction","Equal to sliding friction","Larger than sliding friction"],1],[3,"The reason for the rolling friction to be less than the sliding friction is that there is no relative motion between the wheel and the surface over which it rolls. The wheel touches the surface only at a:",["Line","Point","Area of large size","Volume"],1],[3,"Practically, the contact point is not perfectly circular; it becomes flat under pressure. This flat portion of the wheel has the tendency to slide against the surface and does produce a:",["Zero force","Frictional force","Magnetic force","Nuclear force"],1],[3,"A hovercraft is a kind of ship that can move over the surface of water and ground both. Air is ejected underneath by powerful fans forming a cushion of air. The hovercraft moves over the cushion of air which offers:",["Large resistance","Very small resistance","Infinite resistance","Zero force only"],1],[3,"Methods to reduce friction include: the parts which slide against each other are highly:",["Roughened","Polished","Heated","Magnetized"],1],[3,"Since the friction of liquids is less than that of solid surfaces, therefore, oil or grease is applied between the moving parts of the machinery. This is a method to:",["Increase friction","Reduce friction","Eliminate gravity","Increase mass"],1],[3,"Sliding friction is converted into rolling friction by the use of ball bearings in the machines and wheels under the heavy objects. This reduces friction because rolling friction is much less than:",["Static friction only","Sliding friction","Air resistance","All forces"],1],[3,"High speed vehicles, aeroplanes and ships also face friction while moving through air or water. If the front of a vehicle is flat, it faces more resistance. Therefore, the bodies are streamlined to minimize air or water friction. This type of flow of air is known as:",["Turbulent flow","Streamline flow","Random flow","Circular flow"],1],[3,"The vehicles designed pointed from the front are said to be:",["Rough","Streamlined","Heavy","Magnetic"],1],[3,"The momentum of a moving body is the product of its mass and velocity. Therefore, p = m × v. Momentum is a:",["Scalar quantity","Vector quantity","Force","Energy"],1],[3,"The SI unit of momentum is (kg m s⁻¹). It can also be written as:",["N","N s","J","W"],1],[3,"When a large force F acts on an object for a short interval of time, the impulse of the force is defined as the total change in momentum of the object. Impulse = F Δt = m Δv.",["True as per chapter","False","Only for constant force","Only for free fall"],0],[3,"Force acting on an object is equal to the change in momentum of the object per unit time: F = Δp / Δt. This suggests Newton's second law of motion in terms of momentum: The rate of change of momentum of a body is equal to the:",["Mass","Force acting on it","Velocity","Acceleration only"],1],[3,"The direction of change in momentum is that of the:",["Velocity","Force","Displacement","Mass"],1],[3,"A cricketer draws his hands back to reduce the impact of the ball by:",["Decreasing the time","Increasing the time","Increasing the force","Decreasing the mass"],1],[3,"Fragile objects such as glassware may break easily due to jerks or by the direct impact with hard objects during their transportation. Soft packing materials reduce the effect of quick change in momentum. Consequently, the force acting on the fragile objects is:",["Increased","Greatly reduced","Unchanged","Made infinite"],1],[3,"Special materials like Styrofoam, corrugated cardboard sheets, bubble wrap are used for the packing of such objects to:",["Increase impulse","Reduce force by increasing time of impact","Increase mass","Change velocity only"],1],[3,"A crumple zone of an automobile is a structural feature designed to compress during an accident to absorb deformation energy from the impact. Crumple zones work by managing crash energy absorbing within the outer parts of the vehicle, rather than being directly transmitted to the:",["Engine","Occupants","Wheels","Fuel tank"],1],[3,"In Example 3.3, a bullet of mass 15 g is fired with velocity 150 m s⁻¹. Its momentum is:",["2.25 kg m s⁻¹","2250 kg m s⁻¹","0.225 kg m s⁻¹","22.5 kg m s⁻¹"],0],[3,"In Example 3.4, a cricket ball of mass 160 g is hit. Initial velocity −28 m s⁻¹, final 52 m s⁻¹, contact time 4 × 10⁻³ s. The average force is:",["3200 N","32 N","320 N","3.2 N"],0],[3,"The principle of conservation of momentum states that if no external force acts on an isolated system, the final total momentum of the system is equal to the:",["Initial kinetic energy","Initial total momentum of the system","Final kinetic energy","Mass of the system"],1],[3,"Total momentum of the system before collision = Total momentum of the system after collision. Or m1v1 + m2v2 = m1v1' + m2v2'.",["True as per chapter","False","Only for identical masses","Only for elastic collisions"],0],[3,"When two identical balls collide and the second is at rest, there is a total transfer of momentum. The striking ball comes to rest and the other ball starts moving with the same speed. This shows that the total momentum after collision remains the same as total momentum before collision.",["Correct illustration of conservation of momentum","Violation of conservation","Only for unequal masses","Only in presence of friction"],0],[3,"In Example 3.5, a bullet of mass m1 is fired by a gun of mass m2. The velocity of the gun v2 in terms of velocity of bullet v1 is:",["v2 = m1 v1 / m2","v2 = − m1 v1 / m2","v2 = m2 v1 / m1","v2 = m1 / m2"],1],[3,"The negative sign in v2 = − m1 v1 / m2 indicates that the gun moves:",["Forward","Backward (opposite to the bullet)","Upward","Sideways"],1],[3,"It is because of the backward motion of the gun that the shooter gets a:",["Push forward","Jerk on his shoulder","Pull upward","No effect"],1],[3,"In Example 3.6, a ball of mass 3 kg moving with 5 m s⁻¹ collides with a stationary ball of mass 2 kg and then both move together. The velocity after collision is:",["5 m s⁻¹","3 m s⁻¹","2 m s⁻¹","15 m s⁻¹"],1],[3,"From KEY POINTS: A force is a push or a pull that starts, stops and changes the magnitude and direction of velocity of a body.",["True","False","Only for contact forces","Only for non-contact forces"],0],[3,"From KEY POINTS: Every object in the universe attracts every other object with a force that is directly proportional to the product of their masses and inversely proportional to the square of the distance between them. This is known as:",["Newton's first law","Newton's law of gravitation","Newton's third law","Law of inertia"],1],[3,"From KEY POINTS: The property of a body to maintain its state of rest or of uniform motion is called:",["Momentum","Inertia","Impulse","Weight"],1],[3,"From KEY POINTS: Action and reaction do not act on the same body but act on two different bodies.",["True","False","Only for gravitational forces","Only for contact forces"],0],[3,"From KEY POINTS: Mass of a body does not vary. It is a scalar quantity and its unit is kilogram (kg).",["True","False","Mass varies with location","Mass is a vector"],0],[3,"From KEY POINTS: The resisting force between the two surfaces before the motion starts is called the static friction. The maximum value of the static friction is called:",["Kinetic friction","Limiting friction","Rolling friction","Terminal force"],1],[3,"From KEY POINTS: When upward air resistance balances the downward force of gravity on a falling object, it falls down with constant (safe) velocity, it is called:",["Escape velocity","Terminal velocity","Instantaneous velocity","Average velocity"],1],[3,"From KEY POINTS: Impulse is defined as the product of F × Δt = m × Δv = total change in momentum.",["True","False","Only F × Δt","Only m × Δv"],0],[3,"When we kick a stone, we get hurt. This is due to:",["Inertia","Velocity","Momentum","Reaction"],3],[3,"Which of the following is a non-contact force?",["Friction","Air resistance","Electrostatic force","Tension in the string"],2],[3,"A ball with initial momentum p hits a solid wall and bounces back with the same velocity. Its momentum p' after collision will be:",["p' = p","p' = −p","p' = 2p","p' = −2p"],1],[3,"A particle of mass m moving with a velocity v collides with another particle of the same mass at rest. The velocity of the first particle after collision is:",["v","−v","0","−1/2 v"],2],[3,"Conservation of linear momentum is equivalent to:",["Newton's first law of motion","Newton's second law of motion","Newton's third law of motion","None of these"],2],[3,"An object with a mass of 5 kg moves at constant velocity of 10 m s⁻¹. A constant force then acts for 5 seconds on the object and gives it a velocity of 2 m s⁻¹ in the opposite direction. The force acting on the object is:",["5 N","−10 N","−12 N","−15 N"],3],[3,"A large force acts on an object for a very short interval of time. In this case, it is easy to determine:",["Magnitude of force","Time interval","Product of force and time","None of these"],2],[3,"A lubricant is usually introduced between two surfaces to decrease friction. The lubricant:",["Decreases temperature","Acts as ball bearings","Prevents direct contact of the surfaces","Provides rolling friction"],2],[3,"According to the chapter, mass is measured by ordinary or electronic balances while weight is measured by:",["Ordinary balance","Force meter / spring balance","Platform balance only","Thermometer"],1],[3,"Gravitational field strength g is defined as force per unit mass. Thus g = w/m and this is equivalent to the acceleration of free fall.",["True as per learning outcomes and text","False","Only on Moon","Only in vacuum"],0],[3,"In free-body diagram of a book on a table being pushed, the forces shown typically include applied force, friction, normal force and:",["Magnetic force","Weight","Nuclear force","Electrostatic force only"],1],[3,"The demonstration of property of inertia with table cloth pulled abruptly shows that objects remain in their original position due to:",["Friction","Inertia","Gravity","Magnetic force"],1],[3,"In space, an astronaut throws a wrench; as a reaction he moves in opposite direction. This illustrates:",["Newton's first law","Newton's third law","Conservation of energy only","Friction in space"],1],[3,"Seatbelts prevent the passengers from moving forward when a moving car stops suddenly. Thus, chances of hitting the windshield or steering wheel are reduced. This relates to:",["Inertia and first law","Third law only","Second law only","Gravitation"],0],[3,"The chapter mentions that Pakistani Scientist won the Nobel Prize for helping prove that the weak force and the electromagnetic force are actually unified.",["True (Dr. Abdus Salam)","False","Only electromagnetic","Only strong force"],0],[3,"For Your Information: Some frogs can cling to a vertical surface, such as a leaf, because of the static friction between their feet and the surface.",["True as per text","False","Due to magnetic force","Due to nuclear force"],0],[3,"When a shuttle re-enters the Earth's atmosphere, the friction caused by the atmosphere raises the surface temperature of the shuttle to over:",["100°C","950°C","50°C","500°C"],1],[3,"Friction in human joints is very low because our bodies contain a natural lubricating system. Consequently, though our bones rub against each other at the joints as we move, yet bones do not normally wear out, even after many years of use.",["True as per Do You Know","False","Due to magnetic force","Due to strong nuclear force"],0],[3,"In the Mini Exercise, photographs of rocket launch, runner, and swimmer are given to identify pairs of forces acting (action-reaction pairs).",["True","False","Only one force","No forces"],0],[3,"From numerical problems: A 10 kg block on smooth horizontal surface with 5 N force has acceleration:",["0.5 m s⁻²","2 m s⁻²","50 m s⁻²","0.05 m s⁻²"],0],[3,"Mass of a person 80 kg; weight on Earth (g=10) is 800 N; on Moon (g=1.6) is:",["128 N","80 N","800 N","1.6 N"],0],[3,"Force required to increase velocity of 800 kg car from 10 m s⁻¹ to 30 m s⁻¹ in 10 s is:",["1600 N","800 N","2400 N","160 N"],0],[3,"Recoil speed of 10 kg gun firing 5 g bullet at 300 m s⁻¹ is:",["−0.15 m s⁻¹","0.15 m s⁻¹","−1.5 m s⁻¹","15 m s⁻¹"],0],[3,"Astronaut of 70 kg throws 300 g wrench at 3.5 m s⁻¹; his recoil speed is:",["−1.5 × 10⁻² m s⁻¹","1.5 × 10⁻² m s⁻¹","−0.15 m s⁻¹","0.015 m s⁻¹"],0],[3,"Common velocity of two coupled bogies (6.5×10³ kg at 0.8 m s⁻¹ and 9.2×10³ kg at 1.2 m s⁻¹) is approximately:",["1.03 m s⁻¹","1.0 m s⁻¹","2.0 m s⁻¹","0.8 m s⁻¹"],0],[3,"Impulse applied by floor to a 0.4 kg ball dropped from 1.8 m rebounding to 0.8 m is:",["4 N s upward","4 N s downward","2 N s upward","0"],0],[3,"In conservation of momentum problems, if two objects stick together after collision, it is an example of:",["Elastic collision only","Inelastic collision (perfectly inelastic)","Explosion","Free fall"],1],[3,"The chapter defines resultant force in terms of momentum as related to the rate of change of momentum.",["True","False","Only for constant mass","Only for zero force"],0],[3,"Which force is responsible for β-decay?",["Strong nuclear force","Weak nuclear force","Electromagnetic force","Gravitational force"],1],[3,"Electromagnetic forces are stronger than gravitational and weak nuclear forces but weaker than:",["Contact forces","Strong nuclear force","All forces","Friction"],1],[3,"The range of strong nuclear force is of the order of:",["10⁻¹⁷ m","10⁻¹⁴ m","Infinite","1 m"],1],[3,"Dr. Abdus Salam shared the 1979 Nobel Prize for electroweak unification with:",["Newton and Einstein","Sheldon Glashow and Steven Weinberg","Only Glashow","Only Weinberg"],1],[3,"In free-body diagrams, each force is labelled to indicate the exact type of force. The arrow head indicates the:",["Magnitude","Direction in which the force acts","Time","Mass"],1],[3,"A book placed on a table remains there unless a force is applied to move it. This is an illustration of:",["Newton's second law","Newton's first law","Newton's third law","Conservation of momentum"],1],[3,"If you were in outer space and throw an object away where no force is acted upon it, the object would continue to move forever with:",["Decreasing velocity","Constant velocity","Increasing velocity","Zero velocity"],1],[3,"The first law of motion provides us another definition of force: Force is an agency which changes or tends to change the state of rest or of uniform motion of a body.",["True","False","Only second law defines force","Only third law"],0],[3,"When the table cloth is pulled abruptly, the objects remain in their original position on the table. This demonstrates:",["Friction is zero","Inertia","Gravity is strong","Magnetic force"],1],[3,"According to SI units, if m = 1 kg, a = 1 m s⁻², F = 1 N, then the constant in a = (constant) F/m is:",["0","1","10","Infinite"],1],[3,"First law of motion provides the definition of force i.e., a force produces an acceleration in a body. By the second law (F = ma), we can calculate mathematically the a ","Opposite","Same always"],0],[3,"Terminal velocity is reached when air resistance = weight, so net force = 0 and acceleration = 0.",["True","False","Acceleration remains g","Velocity becomes zero"],0],[3,"Ball bearings reduce friction by converting sliding into rolling. Rolling friction ≈ 1/100 of sliding friction.",["True","False","Equal","Larger"],0],[3,"Streamlining minimizes air/water resistance by allowing streamline flow over the slanting surface.",["True","False","Increases resistance","No effect"],0],[3,"Momentum p = mv is a vector. Its direction is that of velocity.",["True","False","Scalar","Opposite to velocity"],0],[3,"Impulse = change in momentum. For large force short time, impulse is still measurable as mΔv.",["True","False","Force is always known","Time is always known"],0],[3,"Packing materials and crumple zones increase the time of impact (Δt), thereby reducing the force for the same change in momentum (since F = Δp/Δt).",["True","False","Decrease time","Increase force"],0],[3,"Conservation of momentum holds for isolated systems (no external force). It applies to macro and micro objects.",["True","False","Only macro","Only micro"],0],[3,"In gun-bullet system, total momentum before firing is zero. After firing, m_bullet v_bullet + m_gun v_gun = 0, so gun recoils.",["True","False","Both move forward","Momentum not conserved"],0],[3,"When two objects stick and move together after collision, common velocity v = (m1v1 + m2v2)/(m1 + m2).",["True","False","Only if elastic","Only if m1 = m2"],0],[3,"From KEY POINTS: Friction is the force that tends to prevent the bodies from sliding over each other.",["True","False","Helps sliding","Only kinetic"],0],[3,"From KEY POINTS: Energy is wasted in doing work against friction that appears in the form of heat.",["True","False","Appears as light","Conserved fully"],0],[3,"The learning outcomes include defining and calculating weight using w = mg.",["True","False","Only mass","Only g"],0],[3,"The learning outcomes omponent of ℓ that is perpendicular to the force F.",["True","False","Only for couple","Only for parallel forces"],0],[4,"A couple is a special type of torque. When two equal and opposite parallel forces act at two different points of the same body, they form a:",["Resultant force","Couple","Concurrent force","Moment arm"],1],[4,"Examples of couple include opening or closing a water tap, turning key in the lock, opening the lid of a jar and turning steering wheel of a motor car.",["True","False","Only water tap","Only steering"],0],[4,"While turning a vehicle, a couple is applied on the steering wheel. Now-a-days, steering wheels of smaller diameter are installed because most vehicles are provided with power steering in which a pump pushes hydraulic fluid to reduce the force needed to turn the wheels.",["True","False","Larger diameter preferred","No power steering"],0],[4,"In Example 4.2, a spanner 25 cm long is used with force 400 N. Torque is:",["100 N m","10 N m","1000 N m","4 N m"],0],[4,"To divide a force into its components is known as:",["Addition of forces","Resolution of a force","Composition of forces","Resultant force"],1],[4,"Usually, a force is resolved into two components which are perpendicular to each other. These are called its:",["Parallel components","Perpendicular or rectangular components","Like components","Unlike components"],1],[4,"A component of a vector is its effective value in a given:",["Time","Direction","Mass","Speed"],1],[4,"From the right angled triangle, Fx = F cos θ and Fy = F sin θ.",["True","False","Opposite","Only for 45°"],0],[4,"The magnitudes of the perpendicular components can be found using trigonometric ratios: sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse.",["True","False","Only tan","Only for specific angles"],0],[4,"Values of trigonometric ratios for 30°: sin 30° = 0.5, cos 30° = 0.866, tan 30° ≈ 0.577.",["True as per table","False","sin 30° = 0.866","cos 30° = 0.5"],0],[4,"For 45°: sin 45° = cos 45° = 0.707, tan 45° = 1.0.",["True","False","sin 45° = 1","tan 45° = 0"],0],[4,"For 60°: sin 60° = 0.866, cos 60° = 0.5, tan 60° = 1.732.",["True","False","Opposite","All 1"],0],[4,"The magnitude of a force from its perpendicular components is F = √(Fx² + Fy²).",["True","False","F = Fx + Fy","F = Fx × Fy"],0],[4,"The direction θ is given by tan θ = Fy / Fx or θ = tan⁻¹(Fy / Fx).",["True","False","tan θ = Fx / Fy","Only for positive"],0],[4,"In Example 4.3, a force of 160 N at 60° has Fx = 80 N and Fy = 138.6 N.",["True","False","Fx = 138.6 N","Fy = 80 N"],0],[4,"Principle of moments: When a body is in balanced position, the sum of clockwise moments about any point equals the sum of anticlockwise moments about that point.",["True","False","Only about centre","Only for equal forces"],0],[4,"In Activity 4.2 with metre rule, total anticlockwise moments = total clockwise moments: w1 × ℓ1 + w2 × ℓ2 = w3 × ℓ3.",["True","False","Only two weights","Moments not equal"],0],[4,"In Example 4.4, for the metre stick, the second force of 60 N at 30° has Fy = 30 N. Distance d from pinned end for no rotation is 0.6 m.",["True","False","0.3 m","1.0 m"],0],[4,"Centre of gravity is that point where total weight of the body appears to be acting.",["True","False","Where mass acts","Outside always"],0],[4,"If a body is supported at its centre of gravity, it stays there without:",["Translation","Rotation","Acceleration only","Velocity"],1],[4,"The centre of gravity of an object of regular shape lies at its geometrical centre.",["True","False","Outside","At edge"],0],[4,"For square or rectangle, centre of gravity is at the point of intersection of the:",["Medians","Diagonals","Sides","Axes only"],1],[4,"For triangle, centre of gravity is at the point of intersection of the:",["Diagonals","Medians","Altitudes only","Sides"],1],[4,"For round plate or sphere, centre of gravity is at the:",["Edge","Centre","Surface","Outside"],1],[4,"For cylinder, centre of gravity is at the centre of the:",["Base","Axis","Top","Curved surface"],1],[4,"For metre rule, centre of gravity is at the centre of the:",["End","Rod","Edge","Surface"],1],[4,"For an irregular shaped plane lamina, the centre of gravity can be found by suspending it freely through different points. Each time, its centre of gravity lies on the vertical line drawn from the point of suspension with the help of a:",["Spring","Plumb line","Magnet","Scale only"],1],[4,"The exact position of the centre of gravity is at the point where two such lines cross each other. The centre of gravity can exist inside a body or outside the body as is in case of a:",["Sphere","Cup","Cube","Cylinder"],1],[4,"Centre of gravity of a bowl is outside the material.",["True as per For Your Information","False","Always inside","At the rim"],0],[4,"The centre of mass of a body is that point where the whole mass of the body is assumed to be concentrated.",["True","False","Where weight acts only","Outside always"],0],[4,"On the surface of the Earth, where g is almost uniform, the centre of mass of an object coincides with its centre of gravity.",["True","False","Never coincides","Only for spheres"],0],[4,"In Fig. 4.16, a rotating wrench slides along a frictionless floor. Its centre of mass follows a linear path with constant speed because there is no resultant force on the wrench.",["True","False","Accelerates","Stops"],0],[4,"A body is said to be in equilibrium if it has no:",["Velocity","Acceleration","Mass","Force at all"],1],[4,"There are two types of equilibrium: static equilibrium and:",["Unstable equilibrium","Dynamic equilibrium","Neutral equilibrium","Stable equilibrium only"],1],[4,"A body at rest is in static equilibrium whereas a body moving with uniform velocity is in:",["Static equilibrium","Dynamic equilibrium","Unstable equilibrium","Neutral equilibrium"],1],[4,"An example of static equilibrium is a book lying on the table. Fn = w so that sum of forces is zero.",["True","False","Fn > w","Fn < w"],0],[4,"Examples of static equilibrium include an electric bulb hanging from the ceiling, a man holding a box, a beam held horizontal against a wall with the help of a rope and a hanging weight.",["True","False","Only the book","Only dynamic"],0],[4,"A good example of dynamic equilibrium is a paratrooper. After parachute opens, he descends with uniform velocity when force of gravity is balanced by air resistance.",["True","False","Accelerating always","At rest"],0],[4,"First condition of equilibrium: A body is said to be in translational equilibrium only if the vector sum of all the external forces acting on it is equal to zero. ΣF = 0.",["True","False","Στ = 0 only","Both always"],0],[4,"First condition can also be written as ΣFx = 0 and ΣFy = 0.",["True","False","Only one","Only for three forces"],0],[4,"Second condition of equilibrium: The vector sum of all the torques acting on a body about any point must be zero. Στ = 0.",["True","False","Only about centre of gravity","Only for couples"],0],[4,"A body will be in complete equilibrium when ΣFx = 0, ΣFy = 0 and Στ = 0.",["True","False","Only forces","Only torques"],0],[4,"In Example 4.5, a picture of weight 5 N is suspended by two vertical strings. T1 = T2 = 2.5 N.",["True","False","T1 = 5 N","T2 = 0"],0],[4,"A body is said to be in a state of stable equilibrium, if after a slight tilt, it comes back to its original position.",["True","False","Moves away","Stays tilted"],0],[4,"Stable equilibrium occurs when the torques arising from the rotation (tilt) of the object compel the body back towards its equilibrium position. The body remains in equilibrium as long as its centre of mass lies within the base.",["True","False","Outside base","Always unstable"],0],[4,"A body is said to be in a state of unstable equilibrium, if after a slight tilt, it tends to move on further away from its original position.",["True","False","Comes back","Stays"],0],[4,"In unstable equilibrium (cone on tip), centre of gravity is lowered on tilting and continues to fall further.",["True","False","Raised","Unchanged"],0],[4,"A body is in neutral equilibrium, if it comes to rest in its new position after disturbance without any change in its centre of mass.",["True","False","Changes height of CG","Always falls"],0],[4,"Examples of neutral equilibrium: a cylinder resting on a horizontal surface, a ball rolling on a horizontal surface, or a cone resting on its curved surface.",["True","False","Only cylinder","Only ball"],0],[4,"Stability can be improved either by lowering the centre of gravity or by widening the base.",["True","False","Raising CG","Narrowing base"],0],[4,"A low armchair is more stable than a high chair because of its low centre of gravity.",["True","False","High CG better","Same"],0],[4,"If heavy loads are placed on the floor of the bus, its centre of gravity will be low → stable. If loaded on top, CG raised → near unstable.",["True","False","Opposite","No effect"],0],[4,"Racing cars have centres of mass kept as low as possible and base areas increased by keeping the wheels outside of their main bodies to enhance stability.",["True","False","High CG","Narrow base"],0],[4,"Balancing toys are basically in completely stable state and their centres of gravity always remain below the pivot point. If disturbed, CG is raised temporarily and returns by lowering.",["True","False","CG above pivot","Unstable always"],0],[4,"Analogous to Newton's first law for translational motion, a rotating object will continue to do so at the same rate (constant angular velocity) unless acted upon by a resultant moment (torque).",["True","False","Always accelerates","Stops immediately"],0],[4,"When a body is moving along a circular path, its velocity at any point is directed along the tangent drawn at that point. Direction of tangent changes, so velocity changes (even if speed constant). Hence a force perpendicular to velocity is required.",["True","False","Parallel force","No force needed"],0],[4,"The force that causes an object to move in a circle at constant speed is called the:",["Centrifugal force","Centripetal force","Gravitational force only","Frictional force only"],1],[4,"For an object of mass m moving with uniform speed v in circle of radius r, Fc = mv² / r.",["True","False","Fc = mvr","Fc = mv / r"],0],[4,"In Example (stone), 150 g stone at 8 m s⁻¹ in circle of radius 1.2 m. Centripetal force is 8 N.",["True","False","80 N","0.8 N"],0],[4,"Sources of centripetal force: tension in a string for a stone being swirled around; gravity for the Moon orbiting the Earth; friction in washing machine dryer; etc.",["True","False","Only tension","Only gravity"],0],[4,"If the string is released while whirling a stone, the stone flies off along the tangent to the circle and then moves in a straight line with constant velocity (Newton’s first law).",["True","False","Continues circle","Falls immediately"],0],[4,"In washing machine dryer, friction between clothes and drum walls provides necessary centripetal force. Water molecules cannot get the required centripetal force and escape through holes.",["True","False","Water gets more force","Clothes fly out"],0],[4,"In cream separator, milk is whirled rapidly. Lighter particles of cream experience less centripetal force and gather in the central part. Heavier particles move towards the walls.",["True","False","Opposite","Same force"],0],[4,"From KEY POINTS: The torque or moment of a force is defined as the product of the force and the moment arm.",["True","False","Sum","Difference"],0],[4,"From KEY POINTS: When two equal and opposite, parallel forces act at two different points of the same body, they form a couple.",["True","False","Concurrent force","Resultant only"],0],[4,"From KEY POINTS: A body is said to be in equilibrium if it has no acceleration.",["True","False","No velocity","No force"],0],[4,"From KEY POINTS: When a body is in equilibrium, the sum of clockwise moments about any point equals the sum of anticlockwise moments about that point.",["True","False",  var h='<section class="card"><button class="ghost" onclick="home()">← Subjects</button><h2 style="margin-top:12px">'+(isP()?"Physics":"Chemistry")+' · Class 9</h2><p class="mute">Questions per round:</p><div class="row">';
 [10,25,0].forEach(function(n){h+='<button class="'+(S.len===n?'':'ghost')+'" onclick="setLen('+n+')">'+(n||"Endless")+'</button>'});
 h+='</div></section><section class="card"><h2>Custom chapters</h2><p class="mute">Tick the chapters you want in your own quiz.</p><div class="grid">';
 CH.forEach(function(k){h+='<label class="chk"><input type="checkbox" class="cu" value="'+k+'"'+(S.cu&&S.cu.indexOf(k)>=0?' checked':'')+'><span><b>'+W+' '+k+'</b> · '+esc(NM[k])+'</span></label>'});
 h+='</div><div class="err" id="cerr"></div><div class="row"><button class="ghost" onclick="selAll(1)">Select all</button><button class="ghost" onclick="selAll(0)">Clear</button><button onclick="startCustom()">Start custom quiz</button></div></section>';
 app.innerHTML=h}
function selAll(v){Array.prototype.forEach.call(document.querySelectorAll('.cu'),function(c){c.checked=!!v})}
function startCustom(){var a=[];Array.prototype.forEach.call(document.querySelectorAll('.cu'),function(c){if(c.checked)a.push(+c.value)});if(!a.length){document.getElementById('cerr').textContent='Select at least one chapter.';return}S.cu=a;start(a)}
function start(u){S.unit=u;S.seen={};S.i=0;S.score=0;S.wrong=[];S.title=(isP()?"Physics":"Chemistry")+" · Custom: "+unitWord()+(u.length>1?"s ":" ")+u.join(", ");show()}
function show(){var q=S.q=nextQ(),pct=S.len?Math.round(S.i/S.len*100):0;
 var h='<section class="card"><div style="display:flex;justify-content:space-between;gap:8px"><span class="tag">'+esc(S.title)+'</span><span class="mute">Q '+(S.i+1)+(S.len?' of '+S.len:' · score '+S.score+'/'+S.i)+'</span></div>'+(S.len?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'')+'<p class="q">'+esc(q.q)+'</p>';
 q.o.forEach(function(o,i){h+='<button class="opt" id="o'+i+'" onclick="ans('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o.t)+'</button>'});
 app.innerHTML=h+'<p class="src">'+esc(q.s||"")+'</p><div id="nx"></div></section>';window.scrollTo(0,0)}
function ans(i){var q=S.q;if(q.done)return;q.done=true;
 q.o.forEach(function(o,j){var b=document.getElementById("o"+j);b.disabled=true;if(o.c)b.classList.add("ok");else if(j===i)b.classList.add("no")});
 if(q.o[i].c)S.score++;else S.wrong.push({q:q.q,a:q.a,y:q.o[i].t});
 S.i++;var last=S.len&&S.i>=S.len;
 document.getElementById("nx").innerHTML='<p><b>'+(q.o[i].c?"Correct!":"Not quite — the right answer is highlighted.")+'</b></p><div class="row"><button onclick="'+(last?'finish()':'show()')+'">'+(last?"See my result":"Next question")+'</button>'+(!last&&!S.len?'<button class="ghost" onclick="finish()">Finish and review</button>':'')+'</div>';
 document.getElementById("nx").scrollIntoView({block:"nearest"})}
function finish(){var n=S.i||1,p=Math.round(S.score/n*100);
 var msg=p>=90?"Excellent — you are quiz-ready.":p>=70?"Good work. Review the mistakes and try again.":p>=50?"Keep practising this topic.":"Read the unit again, then retry.";
 var h='<section class="card"><span class="tag">'+esc(S.title)+'</span><p class="score">'+S.score+' / '+S.i+'</p><p><b>'+p+'%</b> — '+msg+'</p><div class="row"><button onclick="start(S.unit)">New round (fresh questions)</button><button class="ghost" onclick="units()">Choose other chapters</button><button class="ghost" onclick="home()">Subjects</button></div></section>';
 if(S.wrong.length){h+='<section class="card"><h2>Review your mistakes</h2>';S.wrong.forEach(function(w){h+='<div class="rev"><p><b>'+esc(w.q)+'</b></p><p style="color:var(--bad)">Your answer: '+esc(w.y)+'</p><p style="color:var(--ok)">Correct answer: '+esc(w.a)+'</p></div>'});h+='</section>'}
 app.innerHTML=h;window.scrollTo(0,0)}
home();
</script>
</body>
</html>
